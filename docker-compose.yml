services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: sdp-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - sdp-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: sdp-api
    restart: unless-stopped
    environment:
      QDRANT_URL: http://qdrant:6333
      MAX_UPLOAD_MB: "200"
      API_KEY: "${API_KEY:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    networks:
      - sdp-net

volumes:
  qdrant_storage:

networks:
  sdp-net:
    driver: bridge
